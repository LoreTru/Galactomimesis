<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALACTOMIMESIS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="container">
  <div id="topbar" class="collapsiblePanel">
    <button id="topbarToggle" class="panelToggle" title="Espandi">☰</button>
    <div id="topbarContent" class="panelContent">
      <div id="objectPanel">
        <input type="text" id="objectFilter" placeholder="Filtra oggetti…" autocomplete="off">
        <div id="objectList"></div>
        <div id="objectListActions">
          <button id="applyBtn" type="button">Applica</button>
          <button id="resetBtn" type="button">Reset</button>
        </div>
      </div>
      <select id="pivotSelect">
        <option value="earth">Perno: Terra</option>
        <option value="gc">Perno: Centro Galattico</option>
      </select>
      <select id="gridScaleSelect">
        <option value="1">Griglia: 1× (Terra–oggetto)</option>
        <option value="2">Griglia: 2×</option>
        <option value="5">Griglia: 5×</option>
        <option value="10">Griglia: 10×</option>
        <option value="50">Griglia: 50×</option>
        <option value="0.5">Griglia: 0.5×</option>
      </select>
    </div>
  </div>
  <div id="hint">trascina per ruotare · rotella/pinch per zoom</div>
  <div id="disclaimer"></div>
  <div id="distlabel" style="display:none;"></div>
  <div id="armLabels"></div>
  <div id="info" class="collapsiblePanel">
    <button id="infoToggle" class="panelToggle" title="Comprimi">−</button>
    <div id="infoContent" class="panelContent"></div>
  </div>
</div>

<!-- Correzione rispetto alla versione precedente: cdnjs non pubblica più una
     build UMD/globale (three.min.js) per le versioni recenti di three.js — solo
     build ES module. Verificato tramite ricerca sulla pagina cdnjs.com/libraries/
     three.js: la versione pubblicata al momento della verifica è 0.185.1, con
     asset "three.module.min.js" tra quelli disponibili. Se in futuro la versione
     cambia e questo URL smette di funzionare, controlla la lista aggiornata su
     https://cdnjs.com/libraries/three.js e sostituisci il numero di versione. -->
<script type="module" src="js/main.js"></script>
</body>
</html>
